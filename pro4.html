<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magazine Cover</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }
        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .magazine-cover {
            width: 400px;
            height: 600px;
            background: url('https://source.unsplash.com/400x600/?fashion,model') no-repeat center center/cover;
            position: relative;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
            padding: 20px;
            color: white;
        }
        .title {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            text-transform: uppercase;
            text-align: center;
            font-weight: 700;
            letter-spacing: 2px;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
        }
        .headline {
            position: absolute;
            bottom: 100px;
            left: 20px;
            font-size: 20px;
            font-weight: 700;
        }
        .caption {
            position: absolute;
            bottom: 70px;
            left: 20px;
            font-size: 16px;
            font-style: italic;
        }
        .subscribe {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: red;
            color: white;
            padding: 10px 20px;
            text-transform: uppercase;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }
        .subscribe:hover {
            background: darkred;
        }
    </style>
</head>
<body>
    <div class="magazine-cover">
        <div class="title">Fashion Weekly</div>
        <div class="headline">Exclusive Interview: The Rise of Modern Elegance</div>
        <div class="caption">Inside: Trends that will define the season!</div>
        <button class="subscribe">Subscribe Now</button>
    </div>
</body>
</html>
